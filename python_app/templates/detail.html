{% extends 'base.html' %}
{% block title %}{{ video_name }} · Home Movies{% endblock %}
{% block content %}
<main class="page">
  <a class="back" href="{{ url_for('home') }}"><span aria-hidden="true">←</span> Back to library</a>
  <div class="player-heading"><div><p class="eyebrow">Home Movies</p><h1>{{ video_name }}</h1></div><button class="primary" id="modalButton">Share Video</button></div>
  {% include '_player.html' %}
  <div class="modal" id="myModal">
    <div class="modal-background"></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <header class="modal-card-head"><p class="modal-card-title" id="share-title">Shareable Video Link</p><button class="delete" aria-label="Close" id="closeModal">×</button></header>
      <section class="modal-card-body"><div class="share-controls"><input class="share-input" type="text" id="urlInput" value="" readonly aria-label="Shareable video link"><button class="primary" id="copyButton">Copy to Clipboard</button></div></section>
    </div>
  </div>
</main>
<script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
<script>
        var player = videojs('player', {fluid: true, enableSmoothSeeking: true, disablePictureInPicture: true});
        player.play();
    </script>
<script>
       

      // Bind sharing controls once the rendered player page is available.
      document.addEventListener('DOMContentLoaded', function () {
        var modalButton = document.getElementById('modalButton');
        var closeModalButtons = document.querySelectorAll('#closeModal, .modal-background');
        var copyButton = document.getElementById('copyButton');
        var urlInput = document.getElementById('urlInput');

        /** Request a fresh share token and display the sharing dialog. */
        function openModal() {
          getShareURL();
          document.getElementById('myModal').classList.add('is-active');
        }

        /** Hide the dialog; the issued share token keeps its server-side expiry. */
        function closeModal() {
          document.getElementById('myModal').classList.remove('is-active');
        }

        /** Select and copy the displayed bearer link for the viewer to share. */
        function copyURL() {
          urlInput.select();
          document.execCommand('copy');
        }

        /** Create a 48-hour share link for this exact movie using the login and CSRF token. */
        function getShareURL() {
          const data = {name: {{ full_name|tojson }} };
          fetch("/share_url",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRF-Token": {{ csrf_token|tojson }},
                },
              body: JSON.stringify(data)
            })
              // Read the private URL into the dialog without logging the token.
              .then(response => response.json())
              .then(data => {
                  if (data.url) {
                      urlInput.value = data.url;
                  }
              });
        }

        modalButton.addEventListener('click', openModal);

        // Both dismissal controls hide the same dialog.
        closeModalButtons.forEach(function (element) {
          element.addEventListener('click', closeModal);
        });

        copyButton.addEventListener('click', copyURL);
      });
    </script>
{% endblock %}
