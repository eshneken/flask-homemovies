<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>{% block title %}Home Movies{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='slate.css') }}">
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>
  <header>
    {% block brand %}<a class="brand" href="{{ url_for('home') }}"><span class="brandmark"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg></span>Home Movies</a>{% endblock %}
    {% block navigation %}<nav class="headlinks" aria-label="Main navigation">
      <a class="home-link" href="{{ url_for('home') }}">Home</a>
      {% if current_user.is_authenticated %}
      <form method="POST" action="{{ url_for('logout') }}" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <button class="logout" type="submit">Logout</button>
      </form>
      {% endif %}
    </nav>{% endblock %}
  </header>
  <div class="app-main">{% block content %}{% endblock %}</div>
  <footer class="site-footer"><div class="footer"><span>Home Movies · Private family library</span></div></footer>
</body>
</html>
