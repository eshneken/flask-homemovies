<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="form-field" for="username">Username
  <input id="username" type="text" name="username" placeholder="Your username" autocomplete="username" autofocus>
</label>
<label class="form-field" for="password">Password
  <input id="password" type="password" name="password" placeholder="Your password" autocomplete="current-password">
</label>
<button class="primary" type="submit">Login <span aria-hidden="true">→</span></button>
